version: "2"
sql:
  - engine: "postgresql" # The sql engine to use when parsing the sql queries.
    queries: "internal/db/query/" # The file containing the 'queries' which are 
                                  # annotated with comments specifying the data access methods to be generated.
                                  # Can be just a directory.
    schema: "internal/db/migration/" # The file containing the dml statements. Should be the migrations directory.
    gen:
      go:
        package: "db" # The generated code package 'name'
        out: "internal/db/sqlc/" # The path where the code is to be generated.
        sql_package: "pgx/v5"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: "camel"
        overrides:
          # For TIMESTAMP NOT NULL
          - db_type: "pg_catalog.timestamp"
            go_type: "time.Time"

          # For TIMESTAMP (Nullable)
          - db_type: "pg_catalog.timestamp"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          # For TIMESTAMPTZ NOT NULL (If you use it)
          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"

          # For TIMESTAMPTZ (Nullable)
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true